<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block{
            box-sizing: border-box;
            position: relative;
            width: auto;
            height: 350px;
            background-color: gray;
            position: relative;
        }
        .square {
            width: 300px;
            height: 300px;
            background-color: red;
            position: absolute;
            left: 150px;
            top: 50%;
            transform: translate(-50%, -50%)
        }
    </style>
</head>
<body>
    <div class="block">
        <div class="square">
        </div>

    </div>
    <script src="set.js"></script>
</body>
</html>
